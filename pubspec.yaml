name: highlighted_text_reader
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+3

environment:
  sdk: ^3.6.1

dependencies:
    cloud_firestore: ^6.9.0
    connectivity_plus: ^6.1.3
    firebase_ai: ^3.0.0
    firebase_analytics: ^12.5.0
    firebase_app_check: ^0.4.0
    firebase_auth: ^6.0.0
    firebase_core: ^4.14.0
    firebase_crashlytics: ^5.3.0
    flutter:
        sdk: flutter
    flutter_launcher_icons: ^0.14.3
    go_router: ^14.8.0
    image_picker: ^1.1.2
    introduction_screen: ^4.0.0
    mobile_scanner: ^7.4.0
    package_rename: ^1.8.0
    qr_flutter: ^4.1.0
    shared_preferences: ^2.5.3
    url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # flutter_launcher_icons: "^0.14.3"

flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: false

  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/appIcon.png"
  min_sdk_android: 21
